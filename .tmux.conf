# tcd — tmux config: plugin manager + automatic session save/restore.
#
# First-time setup:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then inside tmux press: prefix + I   (capital i) to install the plugins below.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-restore is OFF, deliberately.
#
# @continuum-restore re-created every saved session on tmux server start. Since
# `tcd close` kills a session without updating the save file, anything you closed
# came straight back on the next launch — closing never stuck.
#
# @resurrect-processes was worse: it restores a process by send-keys'ing the saved
# command line into the pane. The saved line is the fully-resolved binary
# (/Users/.../node/v20.19.4/.../bin/codex --yolo), and it gets typed before zsh has
# finished sourcing nvm, so the trailing C-m is swallowed and the raw path is left
# sitting at the prompt unexecuted. It never actually relaunched an agent — restored
# panes always came back as a bare shell.
#
# Sessions are cheap to recreate: _ai_tmux_project_session_name is deterministic, so
# running `claude` in a repo always lands in that repo's session, restored or not.
#
# Note: attaching to a *live* session from another device is unaffected by any of
# this. Restore only ever mattered after the tmux server itself died.
set -g @continuum-restore 'off'
set -g @resurrect-processes 'false'
set -g @continuum-save-interval '5'

# Name windows after the current dir (= repo name at repo root) instead of the
# running process, which made every claude pane show up as "claude".
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
# resurrect/continuum restores saved names and pins them (auto-rename off);
# re-enable auto-rename after a restore so windows keep tracking their dir.
set -g @resurrect-hook-post-restore-all 'for w in $(tmux list-windows -a -F "#{window_id}"); do tmux set-window-option -t "$w" automatic-rename on; done'

# Keep this last.
run '~/.tmux/plugins/tpm/tpm'
